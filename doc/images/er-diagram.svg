<svg xmlns="http://www.w3.org/2000/svg" width="920" height="296" viewBox="-20 -20 920 296"><style>rect{fill:#ffffff;stroke:#5c5254}rect.header{fill:#ece8e8}text{font:12px sans-serif;fill:#1b1415}text.name{font-weight:600}text.type{fill:#5c5254}line{stroke:#A74C2E;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A74C2E"/></marker></defs><line x1="560" y1="153" x2="640" y2="153" marker-end="url(#arrow)"><title>ORDERS_FOREIGN1 (CUSTOMER_ID)</title></line><line x1="240" y1="79" x2="320" y2="153" marker-end="url(#arrow)"><title>ORDER_LINES_FOREIGN1 (ORDER_ID)</title></line><line x1="240" y1="79" x2="320" y2="15" marker-end="url(#arrow)"><title>ORDER_LINES_FOREIGN2 (PRODUCT_ID)</title></line><g class="table"><rect x="640" y="138" width="240" height="118" rx="4"/><rect x="640" y="138" width="240" height="30" rx="4" class="header"/><text x="648" y="158" class="name">DEMO.CUSTOMERS</text><text x="648" y="182" class="column">ID</text><text x="872" y="182" class="type" text-anchor="end">INTEGER PK NN</text><text x="648" y="202" class="column">NAME</text><text x="872" y="202" class="type" text-anchor="end">CHARACTER VARYING(40) NN</text><text x="648" y="222" class="column">CITY</text><text x="872" y="222" class="type" text-anchor="end">CHARACTER VARYING(30)</text><text x="648" y="242" class="column">JOINED</text><text x="872" y="242" class="type" text-anchor="end">DATE NN</text></g><g class="table"><rect x="320" y="138" width="240" height="118" rx="4"/><rect x="320" y="138" width="240" height="30" rx="4" class="header"/><text x="328" y="158" class="name">DEMO.ORDERS</text><text x="328" y="182" class="column">ID</text><text x="552" y="182" class="type" text-anchor="end">INTEGER PK NN</text><text x="328" y="202" class="column">CUSTOMER_ID</text><text x="552" y="202" class="type" text-anchor="end">INTEGER FK NN</text><text x="328" y="222" class="column">PLACED