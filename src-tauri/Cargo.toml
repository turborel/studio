[package]
name = "turborel-studio"
description = "Turborel Studio, Turborel's desktop database IDE: the Tauri application over turborel-studio-core (RULES.md D1, D9)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "turborel_studio"
crate-type = ["rlib"]

[[bin]]
name = "turborel-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
turborel-studio-core = { path = "../core" }
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Tauri's mock runtime, to call the commands as a webview would (RULES.md D9).
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
