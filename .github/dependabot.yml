# Dependabot proposes each bump of the Rust crates, the npm packages and
# the workflows' actions (RULES.md D4, R-DEP-3). Each is applied as a
# commit of its own, with the decision in RULES.md that names its version
# changed with it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    commit-message:
      prefix: build
    ignore:
      # React stays at 18 while Glide Data Grid supports no later (D11).
      - dependency-name: "react"
        versions: [">=19"]
      - dependency-name: "react-dom"
        versions: [">=19"]
      - dependency-name: "@types/react"
        versions: [">=19"]
      - dependency-name: "@types/react-dom"
        versions: [">=19"]
      # TypeScript stays below 6.1 while typescript-eslint supports no
      # later (D18).
      - dependency-name: "typescript"
        versions: [">=6.1"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    commit-message:
      prefix: ci
