# Kinds
- name: "bug"
  color: "#d73a4a"
  description: "Studio fails, crashes, hangs, or shows a wrong value"
- name: "conformance"
  color: "#5c282b"
  description: "A departure from Turborel's manual, turborel-client or CONFORMANCE.md"
- name: "performance"
  color: "#fbca04"
  description: "Slower than it was or should be, or too much memory"
- name: "feature"
  color: "#a2eeef"
  description: "Something Studio should do that it does not"
- name: "documentation"
  color: "#0075ca"
  description: "Improvements or additions to documentation"

# Impact
- name: "impact/data-loss"
  color: "#b60205"
  description: "Data changed or lost that the user did not mean to change"
- name: "impact/wrong-result"
  color: "#b60205"
  description: "A value or definition shown is not the one the server holds"
- name: "impact/crash"
  color: "#b60205"
  description: "A crash or a hang"
- name: "impact/regression"
  color: "#b60205"
  description: "Worked, or was faster, at an earlier commit"

# Areas
- name: "area/connections"
  color: "#c5def5"
  description: "The connection manager, its workers, settings, TLS, cancel and reconnect"
- name: "area/secrets"
  color: "#c5def5"
  description: "The keychain, and what Studio keeps of a secret"
- name: "area/ipc"
  color: "#c5def5"
  description: "The commands, their validation, events and paging"
- name: "area/shell"
  color: "#c5def5"
  description: "The window, menus, toolbar, status bar, dock, themes and shortcuts"
- name: "area/explorer"
  color: "#c5def5"
  description: "The Object Explorer, its catalog, details and DDL views"
- name: "area/worksheet"
  color: "#c5def5"
  description: "The SQL editor, running statements, history, messages and transactions"
- name: "area/grid"
  color: "#c5def5"
  description: "The results grid, its viewers and exports"
- name: "area/editing"
  color: "#c5def5"
  description: "Editing rows, importing, and the table dialogs"
- name: "area/modeling"
  color: "#c5def5"
  description: "Diagrams, models and schema compare"
- name: "area/analyzer"
  color: "#c5def5"
  description: "Index views, plans and the analyzer's rules"
- name: "area/assistant"
  color: "#c5def5"
  description: "The AI assistant, its providers, tools and audit log"
- name: "area/admin"
  color: "#c5def5"
  description: "The server and session monitor, users, roles, settings and replication"
- name: "area/doc"
  color: "#c5def5"
  description: "doc/, README.md, RULES.md, CONFORMANCE.md, TODO.md, AGENTS.md, CONTRIBUTING.md"
- name: "area/ci"
  color: "#c5def5"
  description: "The workflows, issue forms and labels in .github/"
- name: "area/build"
  color: "#c5def5"
  description: "Manifests, lock files, the checks tool, deny.toml, the icons, .githooks/"
- name: "dependencies"
  color: "#0366d6"
  description: "A crate, a package or an action changes (RULES.md R-DEP-3)"

# Triage
- name: "duplicate"
  color: "#cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "#e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "#d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "#ffffff"
  description: "This will not be worked on"
- name: "good first issue"
  color: "#7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "#008672"
  description: "Extra attention is needed"
