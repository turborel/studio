# Every check a change must pass (RULES.md R-PROC-1, D4), on each platform
# Studio runs on, with a Tauri build of the application; plus the live
# tests against the nightly server, coverage (D7) and the supply chain
# (D23). The Rust toolchain comes from rust-toolchain.toml: `rustup
# toolchain install` with no argument installs it. Every action is pinned
# by its full commit SHA, its version in a comment.
name: verify

# A pull request is checked once, through pull_request, and main again once
# it is merged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request replaces its checks still running.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tauri's webview on Linux, and what its build and bundles need.
  LINUX_PACKAGES: libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev librsvg2-dev file

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - name: Tauri's Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The front end's packages
        run: npm ci --no-fund --no-audit
      # The live tests run on Linux against the nightly server image, set
      # up by the shared harness. The image is built for Linux alone, and
      # macOS and Windows runners have no turboreld, so there they skip.
      # The keychain's test writes to the platform's own keychain: the
      # runner's login Keychain on macOS and Credential Manager on Windows.
      # Linux runners have no Secret Service, so there it runs in the
      # coverage job, which starts one.
      - name: Every check
        timeout-minutes: 60
        env:
          TURBOREL_TEST_SERVER: ${{ runner.os == 'Linux' && 'docker:ghcr.io/turborel/turborel:nightly' || '' }}
          STUDIO_TEST_KEYCHAIN: ${{ runner.os != 'Linux' && '1' || '' }}
        run: cargo xtask verify
      - name: The application builds
        timeout-minutes: 60
        run: npm exec -- tauri build --debug --no-bundle
      # The real window, launched by tauri-driver under WebDriver on a
      # virtual display, drawn with no failure, of no app data and of an
      # earlier build's (RULES.md D49). tauri-driver and WebKit's WebDriver
      # run on Linux alone.
      - name: The window draws
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --version 2.1.0 --locked
          xvfb-run -a cargo xtask smoke target/debug/turborel-studio

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - name: Tauri's Linux packages, and a Secret Service
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES gnome-keyring dbus-x11
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The front end's packages
        run: npm ci --no-fund --no-audit
      # A session bus with gnome-keyring's Secret Service, unlocked with an
      # empty password, so the keychain's test runs against Linux's store.
      - name: Coverage and its floors
        timeout-minutes: 60
        env:
          TURBOREL_TEST_SERVER: docker:ghcr.io/turborel/turborel:nightly
          STUDIO_TEST_KEYCHAIN: "1"
        run: dbus-run-session -- sh -c 'printf "\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && cargo xtask coverage'

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny
      - name: The supply chain
        run: cargo xtask audit
