name: Bug
description: Studio fails, crashes, hangs, or shows a wrong value or definition.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Try the latest `main` first, and search the issues: add to one that matches.
        A vulnerability is never reported here: see SECURITY.md.
        A failure Turborel's own command-line client shows too is the server's: report it to turborel.
        Put a severe impact first in the title: `[DATA LOSS]`, `[WRONG RESULT]`, `[CRASH]`, `[HANG]` or `[REGRESSION]`.
  - type: textarea
    id: summary
    attributes:
      label: What happens
      description: The impact first, in a short paragraph. Then one sentence that sums it up.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Data changed or lost unasked
        - Wrong value or definition shown
        - Crash or hang
        - Wrong error, SQLCODE or SQLSTATE
        - Connection refused or lost
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest steps that show it, and the SQL that sets up the database they run against.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen, and why. Cite Turborel's manual or the User's Guide if it says.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead, with the messages pane's SQLCODE, SQLSTATE and message if there are any.
      render: text
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression
      description: If it worked before, give the last good commit and, if you ran `git bisect`, the first bad one.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short=12 HEAD`"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: The operating system and version, and the architecture, e.g. "Ubuntu 24.04, x86_64".
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server
      description: The turborel commit or release the server was built from.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Connection settings
      description: The URI or settings used, with the password left out, and how the server was reached (TCP, TLS, a Unix socket or a named pipe).
      render: text
