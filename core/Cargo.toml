[package]
name = "turborel-studio-core"
description = "Turborel Studio's backend: connections on worker threads over turborel-client, the catalog, the analyzer, schema models and the assistant, with no user interface (RULES.md D1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
turborel-client.workspace = true
turborel.workspace = true
turborel-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
aws-lc-rs.workspace = true
keyring-core.workspace = true
reqwest.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
rcgen.workspace = true

[lints]
workspace = true

# The live tests against a server (RULES.md R-TEST-7, R-TEST-8, D27): one
# program of their own harness, which starts the server once, runs every
# test, and stops it, so nothing is left running.
[[test]]
name = "live"
path = "tests/live/main.rs"
harness = false
